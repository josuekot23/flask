<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Dashboard Signaux RF — SondeX</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

{% include "_header.html" %}

<div class="page-content">

<h2>Dashboard Signaux RF</h2>

<div class="controls">
    <label>Début
        <input type="datetime-local" id="start-date">
    </label>
    <label>Fin
        <input type="datetime-local" id="end-date">
    </label>
    <label>Mesure
        <select id="measurement-select">
            {% for m in measurements %}
            <option value="{{ m }}" {% if m == default_measurement %}selected{% endif %}>{{ measurement_labels[m] }}</option>
            {% endfor %}
        </select>
    </label>
    <label>Site
        <select id="site-select">
            {% for site in sites %}
            <option value="{{ site }}">{{ site }}</option>
            {% endfor %}
        </select>
    </label>
    <button id="apply-btn">Appliquer</button>
    <button id="reset-btn" class="secondary">Dernières 24h</button>
    <span id="status" class="status"></span>
</div>

<div class="terminal-row">
    <a id="terminal-link-btn" class="consult-btn terminal-btn" href="#" target="_blank" rel="noopener" style="display:none;">🖥️ Accéder au terminal →</a>
    <span id="terminal-empty" class="terminal-empty">Aucun lien terminal configuré pour ce site</span>
    <button id="terminal-edit-btn" class="icon-btn" type="button" title="Modifier le lien terminal">⚙</button>
    <div id="terminal-edit-form" class="terminal-edit-form" style="display:none;">
        <input type="url" id="terminal-url-input" placeholder="https://...">
        <button id="terminal-save-btn" type="button">Enregistrer</button>
        <button id="terminal-cancel-btn" class="secondary" type="button">Annuler</button>
        <span id="terminal-status" class="status"></span>
    </div>
</div>

<div id="rf-plot"></div>

<div class="freq-panel">
    <h3>Fréquences (<span id="freq-count">0</span>)</h3>
    <ul class="freq-list" id="freq-list"></ul>
</div>

<hr class="divider">

<h2>Température des sondes</h2>

<div class="controls">
    <label>Début
        <input type="datetime-local" id="temp-start-date">
    </label>
    <label>Fin
        <input type="datetime-local" id="temp-end-date">
    </label>
    <label>Site
        <select id="temp-site-select">
            <option value="">Tous les sites</option>
            {% for site in sites %}
            <option value="{{ site }}">{{ site }}</option>
            {% endfor %}
        </select>
    </label>
    <button id="temp-apply-btn">Appliquer</button>
    <button id="temp-reset-btn" class="secondary">Dernières 24h</button>
    <span id="temp-status" class="status"></span>
</div>

<div id="temp-plot"></div>

</div>

{% include "_footer.html" %}

<script>
    const PRESELECTED_SITE = {{ preselected_site|tojson }};
</script>
<script src="{{ url_for('static', filename='main.js') }}"></script>
</body>
</html>
