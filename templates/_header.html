<header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">
        <span class="brand-mark">
            <span class="brand-bar"></span>
            <span class="brand-bar"></span>
            <span class="brand-bar"></span>
        </span>
        <span class="brand-text">
            <span class="brand-name">SondeX</span>
            <span class="brand-tagline">Surveillance RF DVB-T</span>
        </span>
    </a>
    <nav class="site-nav">
        <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Accueil</a>
        <a class="nav-link {% if request.endpoint == 'quick_check' %}active{% endif %}" href="{{ url_for('quick_check') }}">Quick Check</a>
        <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}" href="{{ url_for('dashboard') }}">Dashboard</a>
        <a class="nav-link {% if request.endpoint == 'journal' %}active{% endif %}" href="{{ url_for('journal') }}">Journal</a>
        <select id="tz-select" class="tz-select" title="Fuseau horaire d'affichage"
                onchange="document.cookie='tz_choice='+this.value+';path=/;max-age=31536000'; window.location.reload();">
            <option value="auto" {% if current_tz_choice == 'auto' %}selected{% endif %}>Auto (Europe/Paris)</option>
            <option value="utc1" {% if current_tz_choice == 'utc1' %}selected{% endif %}>UTC+1</option>
            <option value="utc2" {% if current_tz_choice == 'utc2' %}selected{% endif %}>UTC+2</option>
        </select>
        {% if current_user.is_authenticated %}
        <span class="user-info">
            {{ current_user.id }}{% if current_user.is_admin %} <span class="admin-badge">admin</span>{% endif %}
        </span>
        <a class="nav-link" href="{{ url_for('logout') }}">Déconnexion</a>
        {% endif %}
    </nav>
</header>
